name: Deploy Website via VPN

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Connect to Tailscale VPN
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 2. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. Deploy Docker Container via SSH over Tailscale
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Pull image Nginx terbaru dari Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/web-nginx:latest

            # 2. Hentikan & hapus container lama jika sedang berjalan
            docker stop website-nginx || true
            docker rm website-nginx || true

            # 3. Jalankan container baru dengan image terbaru
            docker run -d \
              --name website-nginx \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/web-nginx:latest

            # 4. (Opsional) Bersihkan image lama yang tidak terpakai
            docker image prune -f
